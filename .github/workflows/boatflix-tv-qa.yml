name: BOATFLIX TV device QA
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Signed Android APK build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [android-tv, google-tv]
    env:
      RELEASE_VERSION: '1.32'
      TV_ABI: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v4
        with:
          name: BOATFLIX-Android-1.32
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Emulator acceleration and debug build settings
        run: |
          touch local.properties
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: TV remote and signed release launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-boatflix-tv-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BOATFLIX-${{ matrix.target }}-QA-1.32
          path: |
            tv-qa
            androidApp/build/reports/androidTests
            androidApp/build/outputs/androidTest-results
