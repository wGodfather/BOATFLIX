name: BOATFLIX Android and TV

on:
  workflow_call:
    inputs:
      run_tv_qa:
        type: boolean
        default: true
      run_tablet_qa:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_tv_qa:
        description: Android TV ve Google TV testlerini çalıştır
        type: boolean
        default: true
      run_tablet_qa:
        description: Tablet kitaplık ve indirme arayüzünü test et
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.BOATFLIX_ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.BOATFLIX_ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.BOATFLIX_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.BOATFLIX_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Independent BOATFLIX signing key
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for key in ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']:
              if not os.environ.get(key):
                  raise RuntimeError(f'{key} secret is missing')
          keyfile = Path(os.environ['RUNNER_TEMP']) / 'boatflix.p12'
          keyfile.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          keyfile.chmod(0o600)
          Path('local.properties').write_text('\n'.join([
              f'NUVIO_RELEASE_STORE_FILE={keyfile}',
              f'NUVIO_RELEASE_STORE_PASSWORD={os.environ["STORE_PASSWORD"]}',
              f'NUVIO_RELEASE_KEY_ALIAS={os.environ["KEY_ALIAS"]}',
              f'NUVIO_RELEASE_KEY_PASSWORD={os.environ["KEY_PASSWORD"]}',
          ]) + '\n')
          PY
          echo "RELEASE_VERSION=$(sed -n 's/^VERSION_NAME=//p' composeApp/Configuration/DesktopVersion.properties | tr -d '\r')" >> "$GITHUB_ENV"
          chmod +x gradlew
          git lfs pull --include="composeApp/src/full/**,composeApp/src/androidMain/**,composeApp/src/androidFull/**" --exclude=""
      - name: Fork regression tests and signed mobile / TV APKs
        run: |
          ./gradlew :composeApp:testAndroidHostTest --tests '*TorrentFileSelectionTest*' --tests '*AndroidTorrentDownloadTest*' --tests '*AndroidDownloadTransferTest*' --tests '*P2pStreamingEngineAndroidTest*' --tests '*TmdbCatalogTransportTest*' --tests '*SearchRequestStateTest*' --tests '*CatalogPaginationStateTest*' --tests '*StreamParserTest*' --tests '*StreamListingPolicyTest*' --tests '*StreamDownloadButtonTest*' --tests '*StreamSourceVerificationTest*' :androidApp:assembleFullRelease -Pkotlin.compiler.execution.strategy=in-process -PreleaseMinifyEnabled=false --max-workers=1 --no-configuration-cache --no-daemon
          mkdir -p dist
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            abi=$(basename "$apk" | sed 's/androidApp-full-//;s/-release.apk//')
            target="dist/BOATFLIX-Android-$abi-$RELEASE_VERSION.apk"
            cp "$apk" "$target"
            "$build_tools/apksigner" verify --verbose --print-certs "$target" > "$target.signature.txt"
            "$build_tools/aapt" dump badging "$target" > "$target.manifest.txt"
            grep -q "package: name='com.wgodfather.boatflix'.*versionName='$RELEASE_VERSION'" "$target.manifest.txt"
            grep -q "application-label:'BOATFLIX'" "$target.manifest.txt"
            "$build_tools/aapt" dump xmltree "$target" AndroidManifest.xml > "$target.xmltree.txt"
            grep -q 'android.intent.category.LEANBACK_LAUNCHER' "$target.xmltree.txt"
            grep -q 'com.nuvio.app.BoatflixTvActivity' "$target.xmltree.txt"
            grep -q 'android.hardware.touchscreen' "$target.xmltree.txt"
            sha256sum "$target" > "$target.sha256"
          done
          test "$(find dist -name '*.apk' | wc -l)" = 5
          mkdir -p build/upgrade-133
          gh release download 1.33 --repo "$GITHUB_REPOSITORY" --pattern BOATFLIX-Android-universal-1.33.apk --pattern SHA256SUMS.txt --dir build/upgrade-133
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('build/upgrade-133/BOATFLIX-Android-universal-1.33.apk')
          sums = dict((name, digest) for digest, name in (line.split(maxsplit=1) for line in (p.parent/'SHA256SUMS.txt').read_text().splitlines()))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == sums[p.name]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BOATFLIX-Android-${{ env.RELEASE_VERSION }}
          overwrite: true
          path: dist/*
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mobile search, downloads and torrent integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash .github/scripts/test-boatflix-android-upgrade.sh
            bash .github/scripts/run-android-fork-qa.sh
      - name: Preserve mobile device test reports
        run: |
          mkdir -p mobile-qa
          cp -a androidApp/build/outputs/androidTest-results mobile-qa/
      - name: Tablet library and downloads
        if: inputs.run_tablet_qa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: true
          avd-name: boatflix-tablet
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :androidApp:connectedFullDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nuvio.android.LibraryDownloadsUiTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pkotlin.compiler.execution.strategy=in-process --max-workers=1 --no-configuration-cache --no-daemon
            mkdir -p tablet-qa
            adb pull /sdcard/Android/data/com.wgodfather.boatflix.debug/files/fork-ui-qa/library-downloads.png tablet-qa/
      - name: Preserve tablet device test reports
        if: inputs.run_tablet_qa
        run: |
          mkdir -p tablet-qa
          cp -a androidApp/build/outputs/androidTest-results tablet-qa/
      - name: Android TV launcher and remote navigation
        if: inputs.run_tv_qa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: true
          avd-name: boatflix-tv
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-boatflix-tv-qa.sh
      - name: Preserve Android TV device test reports
        if: inputs.run_tv_qa
        run: |
          cp -a tv-qa android-tv-qa
          cp -a androidApp/build/outputs/androidTest-results android-tv-qa/
      - name: Google TV launcher and remote navigation
        if: inputs.run_tv_qa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: true
          avd-name: boatflix-google-tv
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-boatflix-tv-qa.sh
      - name: Test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOATFLIX-Android-QA-${{ env.RELEASE_VERSION }}
          overwrite: true
          path: |
            composeApp/build/test-results/testAndroidHostTest
            androidApp/build/reports/androidTests
            androidApp/build/outputs/androidTest-results
            android-seed.log
            android-pack-seed.log
            android-pack-fixture.json
            build/upgrade-qa
            android-qa-logcat.txt
            android-ui-screenshots
            mobile-qa
            tablet-qa
            android-tv-qa
            tv-qa
